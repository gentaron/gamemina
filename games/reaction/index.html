<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反射神経 | GameMina</title>
  <meta name="description" content="緑に変わった瞬間をタップ。ミリ秒単位で反射速度を競う。">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { --ga: var(--neon-yellow); }
    .panel {
      width: min(560px, 92vw);
      height: 300px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: 1.5px solid var(--line);
      background: linear-gradient(160deg, #12122a, #0d0d1f);
      transition: background .12s, border-color .12s, box-shadow .12s;
    }
    .panel .big {
      font-family: var(--font-pixel);
      font-size: clamp(34px, 7vw, 52px);
      letter-spacing: 3px;
    }
    .panel .small { color: var(--text-dim); font-size: 14px; padding: 0 20px; }
    .panel.wait {
      border-color: var(--neon-pink);
      box-shadow: 0 0 26px rgba(255, 45, 120, 0.3);
    }
    .panel.wait .big { color: var(--neon-pink); text-shadow: 0 0 18px var(--neon-pink); }
    .panel.go {
      border-color: var(--neon-green);
      background: linear-gradient(160deg, #0c2410, #07170a);
      box-shadow: 0 0 34px rgba(57, 255, 20, 0.45);
    }
    .panel.go .big { color: var(--neon-green); text-shadow: 0 0 22px var(--neon-green); }
    .panel.result {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 26px rgba(255, 230, 0, 0.3);
    }
    .panel.result .big { color: var(--neon-yellow); text-shadow: 0 0 20px var(--neon-yellow); }
    .recent {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .recent span {
      font-family: var(--font-pixel);
      font-size: 13px;
      color: var(--text-dim);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 5px 14px;
      background: rgba(14, 14, 31, .7);
    }
    .recent span.latest { color: var(--neon-yellow); border-color: rgba(255,230,0,.5); }
  </style>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap game-topbar" style="height:auto">
      <a class="link-home" href="/">&larr; HOME</a>
      <button id="muteBtn" class="btn-mute" type="button">SOUND ON</button>
    </div>
  </header>

  <main class="wrap game-page">
    <div class="game-heading">
      <h1>反射神経</h1>
      <p class="sub">REACTION — 緑が点灯した瞬間を捉えろ</p>
    </div>

    <div class="hud">
      <div class="hud-chip"><span class="label">LAST</span><span class="value" id="lastVal">--</span></div>
      <div class="hud-chip"><span class="label">AVG(5)</span><span class="value" id="avgVal">--</span></div>
      <div class="hud-chip"><span class="label">BEST</span><span class="value" id="bestVal">--</span></div>
    </div>

    <div class="stage">
      <div class="panel" id="panel" role="button" tabindex="0" aria-label="反射テストパネル">
        <p class="big" id="bigText">TAP TO START</p>
        <p class="small" id="smallText">タップしてスタート。緑に変わったらすぐタップ！</p>
      </div>
    </div>

    <div class="recent" id="recent"></div>

    <section class="howto">
      <h2>HOW TO PLAY</h2>
      <ul>
        <li>パネルをタップすると「まって…」の赤状態に。変化したら即タップ。</li>
        <li>緑になる前に押すとフライング。冷静に待つのが意外と難しい。</li>
        <li>直近5回の平均と、歴代最速（最小ミリ秒）を記録。</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; 2026 GameMina / gentaron</p>
      <p class="footer-note">Static site hosted on Netlify</p>
    </div>
  </footer>

  <script src="/js/sfx.js"></script>
  <script>
  (function () {
    'use strict';
    var panel = document.getElementById('panel');
    var bigText = document.getElementById('bigText');
    var smallText = document.getElementById('smallText');
    var lastVal = document.getElementById('lastVal');
    var avgVal = document.getElementById('avgVal');
    var bestVal = document.getElementById('bestVal');
    var recentEl = document.getElementById('recent');

    var state = 'idle'; /* idle | wait | go | result */
    var goAt = 0, waitTimer = null, recent = [];

    function loadBest() { var v = parseInt(localStorage.getItem('gm_best_reaction'), 10); return isNaN(v) ? null : v; }
    function showBest() {
      var b = loadBest();
      bestVal.textContent = b === null ? '--' : b + ' ms';
    }
    function renderRecent() {
      recentEl.innerHTML = '';
      recent.slice(-5).forEach(function (ms, i, arr) {
        var s = document.createElement('span');
        s.textContent = ms + ' ms';
        if (i === arr.length - 1) s.classList.add('latest');
        recentEl.appendChild(s);
      });
      if (recent.length) {
        var slice = recent.slice(-5);
        var avg = Math.round(slice.reduce(function (a, b) { return a + b; }, 0) / slice.length);
        avgVal.textContent = avg + ' ms';
      }
    }

    function toWait() {
      state = 'wait';
      panel.className = 'panel wait';
      bigText.textContent = 'まって…';
      smallText.textContent = '緑に変わるまで我慢。';
      waitTimer = setTimeout(toGo, 1200 + Math.random() * 2300);
    }

    function toGo() {
      state = 'go';
      goAt = performance.now();
      panel.className = 'panel go';
      bigText.textContent = 'おせ!';
      smallText.textContent = '今だ！';
      SFX.go();
    }

    function showResult(ms) {
      state = 'result';
      panel.className = 'panel result';
      var rank = ms < 200 ? '超人級！' : ms < 250 ? 'プロゲーマー級' : ms < 320 ? '一流' : ms < 420 ? '標準' : 'まだ伸びしろあり';
      bigText.textContent = ms + ' ms';
      smallText.textContent = rank + ' — もう一回？';
      lastVal.textContent = ms + ' ms';
      recent.push(ms);
      renderRecent();
      var best = loadBest();
      if (best === null || ms < best) {
        localStorage.setItem('gm_best_reaction', String(ms));
        smallText.textContent = rank + ' NEW RECORD!';
      }
      showBest();
    }

    function flying() {
      clearTimeout(waitTimer);
      state = 'result';
      panel.className = 'panel result';
      bigText.textContent = 'フライング!';
      smallText.textContent = '緑を待ってからタップ。';
    }

    function onTap() {
      if (state === 'idle' || state === 'result') {
        SFX.click();
        toWait();
      } else if (state === 'wait') {
        flying();
      } else if (state === 'go') {
        showResult(Math.round(performance.now() - goAt));
      }
    }

    panel.addEventListener('click', onTap);
    panel.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); onTap(); }
    });

    showBest();
  })();
  </script>
</body>
</html>
