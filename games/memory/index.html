<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>神経衰弱 | GameMina</title>
  <meta name="description" content="8組のペアをめくるネオン風神経衰弱。クリアタイムを競おう。">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { --ga: var(--neon-cyan); }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 86px);
      gap: 12px;
      justify-content: center;
    }
    .cell {
      perspective: 600px;
      width: 86px;
      height: 108px;
      cursor: pointer;
    }
    .card3d {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .35s cubic-bezier(.4,.2,.2,1);
    }
    .cell.open .card3d, .cell.done .card3d { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .face-back {
      background: linear-gradient(160deg, #14142c, #1b1b3a);
      border: 1.5px solid var(--line);
      font-family: var(--font-display);
      font-size: 20px;
      color: #3a3a66;
    }
    .face-front {
      transform: rotateY(180deg);
      background: linear-gradient(160deg, #0e0e22, #14142e);
      border: 1.5px solid var(--neon-cyan);
      font-family: var(--font-pixel);
      font-size: 34px;
      color: var(--neon-cyan);
      text-shadow: 0 0 14px var(--neon-cyan);
    }
    .cell.done .face-front {
      border-color: var(--neon-green);
      color: var(--neon-green);
      text-shadow: 0 0 14px var(--neon-green);
      animation: settle .4s ease;
    }
    @keyframes settle { 0% { transform: rotateY(180deg) scale(1.12); } 100% { transform: rotateY(180deg) scale(1); } }
    .cell.shake { animation: shake .3s ease; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-5px); } 60% { transform: translateX(5px); } }
    @media (max-width: 430px) {
      .board { grid-template-columns: repeat(4, minmax(64px, 78px)); gap: 9px; }
      .cell { width: 100%; height: 96px; }
      .face-front { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap game-topbar" style="height:auto">
      <a class="link-home" href="/">&larr; HOME</a>
      <button id="muteBtn" class="btn-mute" type="button">SOUND ON</button>
    </div>
  </header>

  <main class="wrap game-page">
    <div class="game-heading">
      <h1>神経衰弱</h1>
      <p class="sub">MEMORY MATCH — 同じマークのペアを8組そろえろ</p>
    </div>

    <div class="hud">
      <div class="hud-chip"><span class="label">TIME</span><span class="value" id="timeVal">0.0s</span></div>
      <div class="hud-chip"><span class="label">MOVES</span><span class="value" id="moveVal">0</span></div>
      <div class="hud-chip"><span class="label">PAIRS</span><span class="value" id="pairVal">0 / 8</span></div>
      <div class="hud-chip"><span class="label">BEST</span><span class="value" id="bestVal">--</span></div>
    </div>

    <div class="stage" id="stage">
      <div class="board" id="board" aria-label="カード"></div>
      <div class="overlay" id="ovStart">
        <p class="ov-title">READY?</p>
        <p class="ov-text">カードをめくって同じマークを探そう</p>
        <button class="btn-neon" id="btnStart" type="button">START</button>
      </div>
      <div class="overlay hidden" id="ovClear">
        <p class="ov-title">CLEAR!</p>
        <p class="ov-stats" id="clearStats"></p>
        <p class="ov-text" id="clearMsg"></p>
        <button class="btn-neon" id="btnRetry" type="button">RETRY</button>
      </div>
    </div>

    <section class="howto">
      <h2>HOW TO PLAY</h2>
      <ul>
        <li>カードを1枚ずつめくり、同じマークのペアを見つける。</li>
        <li>8組すべて揃えばクリア。クリアタイムが最短記録に挑戦。</li>
        <li>間違えたペアはしばらくして自動で裏返る。記憶して効率よく。</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; 2026 GameMina / gentaron</p>
      <p class="footer-note">Static site hosted on Netlify</p>
    </div>
  </footer>

  <script src="/js/sfx.js"></script>
  <script>
  (function () {
    'use strict';
    var SYMBOLS = ['◆', '★', '▲', '●', '✚', '▼', '■', '✖'];
    var COLORS = ['#00e5ff', '#ffe600', '#ff2d78', '#b26bff', '#39ff14', '#ff8c1a', '#00e5ff', '#ff2d78'];

    var board = document.getElementById('board');
    var timeVal = document.getElementById('timeVal');
    var moveVal = document.getElementById('moveVal');
    var pairVal = document.getElementById('pairVal');
    var bestVal = document.getElementById('bestVal');
    var ovStart = document.getElementById('ovStart');
    var ovClear = document.getElementById('ovClear');
    var clearStats = document.getElementById('clearStats');
    var clearMsg = document.getElementById('clearMsg');

    var first = null, lock = false, moves = 0, pairs = 0;
    var startTime = 0, timerId = null, running = false;

    function fmtBest(v) { return v.toFixed(1) + 's'; }
    function loadBest() { var v = parseFloat(localStorage.getItem('gm_best_memory')); return isNaN(v) ? null : v; }
    function showBest() { var b = loadBest(); bestVal.textContent = b === null ? '--' : fmtBest(b); }

    function shuffle(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function build() {
      board.innerHTML = '';
      first = null; lock = false; moves = 0; pairs = 0;
      moveVal.textContent = '0';
      pairVal.textContent = '0 / 8';
      timeVal.textContent = '0.0s';

      var deck = shuffle(SYMBOLS.concat(SYMBOLS));
      deck.forEach(function (sym, idx) {
        var cell = document.createElement('button');
        cell.className = 'cell';
        cell.setAttribute('aria-label', 'カード');
        cell.innerHTML =
          '<div class="card3d">' +
            '<div class="face face-back">GM</div>' +
            '<div class="face face-front" style="color:' + COLORS[SYMBOLS.indexOf(sym)] + ';text-shadow:0 0 14px currentColor">' + sym + '</div>' +
          '</div>';
        cell.addEventListener('click', function () { onFlip(cell, sym); });
        board.appendChild(cell);
      });
    }

    function startTimer() {
      running = true;
      startTime = Date.now();
      timerId = setInterval(function () {
        timeVal.textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
      }, 100);
    }

    function onFlip(cell, sym) {
      if (lock || cell.classList.contains('open') || cell.classList.contains('done')) return;
      if (!running) return;
      SFX.flip();
      cell.classList.add('open');

      if (first === null) { first = { cell: cell, sym: sym }; return; }

      moves++;
      moveVal.textContent = moves;

      if (first.sym === sym) {
        first.cell.classList.remove('open');
        first.cell.classList.add('done');
        cell.classList.remove('open');
        cell.classList.add('done');
        first = null;
        pairs++;
        pairVal.textContent = pairs + ' / 8';
        SFX.match();
        if (pairs === 8) finish();
      } else {
        lock = true;
        var a = first.cell, b = cell;
        first = null;
        setTimeout(function () {
          a.classList.add('shake'); b.classList.add('shake');
          SFX.miss();
        }, 320);
        setTimeout(function () {
          a.classList.remove('open', 'shake');
          b.classList.remove('open', 'shake');
          lock = false;
        }, 700);
      }
    }

    function finish() {
      running = false;
      clearInterval(timerId);
      var secs = (Date.now() - startTime) / 1000;
      var best = loadBest();
      var isRecord = best === null || secs < best;
      if (isRecord) {
        localStorage.setItem('gm_best_memory', String(secs));
        clearMsg.textContent = 'NEW RECORD! 最高記録を更新した';
      } else {
        clearMsg.textContent = '最高記録 ' + fmtBest(best) + ' — 次はもっと速く';
      }
      clearStats.textContent = 'TIME ' + secs.toFixed(1) + 's / MOVES ' + moves;
      SFX.clear();
      showBest();
      setTimeout(function () { ovClear.classList.remove('hidden'); }, 500);
    }

    document.getElementById('btnStart').addEventListener('click', function () {
      SFX.click();
      ovStart.classList.add('hidden');
      build();
      startTimer();
    });
    document.getElementById('btnRetry').addEventListener('click', function () {
      SFX.click();
      ovClear.classList.add('hidden');
      build();
      startTimer();
    });

    showBest();
    build();
  })();
  </script>
</body>
</html>
