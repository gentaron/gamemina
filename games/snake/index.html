<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スネーク | GameMina</title>
  <meta name="description" content="餌を食べて伸びるネオンスネーク。壁と自分の体に気をつけて高スコアを狙え。">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { --ga: var(--neon-green); }
    canvas {
      background: rgba(10, 10, 24, 0.9);
      border: 1.5px solid var(--neon-green);
      border-radius: 14px;
      box-shadow: 0 0 24px rgba(57, 255, 20, 0.25), inset 0 0 30px rgba(57, 255, 20, 0.05);
      max-width: 100%;
      touch-action: none;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 58px);
      gap: 8px;
      justify-content: center;
      margin-top: 22px;
    }
    .dbtn {
      font-size: 22px;
      color: var(--neon-green);
      background: rgba(14, 14, 31, 0.9);
      border: 1.5px solid rgba(57, 255, 20, 0.5);
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .dbtn:active { background: rgba(57, 255, 20, 0.2); box-shadow: 0 0 14px rgba(57,255,20,.4); }
    .dbtn.up    { grid-area: 1 / 2; }
    .dbtn.left  { grid-area: 2 / 1; }
    .dbtn.down  { grid-area: 3 / 2; }
    .dbtn.right { grid-area: 2 / 3; }
    .dpad .spacer { visibility: hidden; }
  </style>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap game-topbar" style="height:auto">
      <a class="link-home" href="/">&larr; HOME</a>
      <button id="muteBtn" class="btn-mute" type="button">SOUND ON</button>
    </div>
  </header>

  <main class="wrap game-page">
    <div class="game-heading">
      <h1>スネーク</h1>
      <p class="sub">SNAKE — 伸びるほど危うくなる、懐かしの一本</p>
    </div>

    <div class="hud">
      <div class="hud-chip"><span class="label">SCORE</span><span class="value" id="scoreVal">0</span></div>
      <div class="hud-chip"><span class="label">LENGTH</span><span class="value" id="lenVal">3</span></div>
      <div class="hud-chip"><span class="label">BEST</span><span class="value" id="bestVal">--</span></div>
    </div>

    <div class="stage">
      <canvas id="cv" width="420" height="420" aria-label="スネークの盤面"></canvas>
      <div class="overlay" id="ovStart">
        <p class="ov-title">SNAKE</p>
        <p class="ov-text">矢印キー / WASD / 十字ボタンで移動</p>
        <button class="btn-neon" id="btnStart" type="button">START</button>
      </div>
      <div class="overlay hidden" id="ovOver">
        <p class="ov-title">GAME OVER</p>
        <p class="ov-stats" id="overStats"></p>
        <p class="ov-text" id="overMsg"></p>
        <button class="btn-neon" id="btnRetry" type="button">RETRY</button>
      </div>
    </div>

    <div class="dpad" aria-label="方向ボタン">
      <button class="dbtn up" data-dir="up" type="button" aria-label="上">&#9650;</button>
      <button class="dbtn left" data-dir="left" type="button" aria-label="左">&#9664;</button>
      <span class="spacer"></span>
      <button class="dbtn right" data-dir="right" type="button" aria-label="右">&#9654;</button>
      <button class="dbtn down" data-dir="down" type="button" aria-label="下">&#9660;</button>
    </div>

    <section class="howto">
      <h2>HOW TO PLAY</h2>
      <ul>
        <li>緑の餌を食べてスコアを稼ぐ。1匹で10点、食べるごとに蛇が伸びる。</li>
        <li>壁や自分の体にぶつかるとゲームオーバー。速度は少しずつ上がる。</li>
        <li>最高スコアは端末に保存される。</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; 2026 GameMina / gentaron</p>
      <p class="footer-note">Static site hosted on Netlify</p>
    </div>
  </footer>

  <script src="/js/sfx.js"></script>
  <script>
  (function () {
    'use strict';
    var GRID = 21, CELL = 20;
    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var scoreVal = document.getElementById('scoreVal');
    var lenVal = document.getElementById('lenVal');
    var bestVal = document.getElementById('bestVal');
    var ovStart = document.getElementById('ovStart');
    var ovOver = document.getElementById('ovOver');
    var overStats = document.getElementById('overStats');
    var overMsg = document.getElementById('overMsg');

    var snake, dir, nextDirs, food, score, timerId = null, speed;
    var running = false;

    function loadBest() { var v = parseInt(localStorage.getItem('gm_best_snake'), 10); return isNaN(v) ? 0 : v; }
    function showBest() { var b = loadBest(); bestVal.textContent = b > 0 ? b + '' : '--'; }

    function randFood() {
      var p;
      do {
        p = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
      } while (snake.some(function (s) { return s.x === p.x && s.y === p.y; }));
      return p;
    }

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDirs = [];
      score = 0;
      speed = 150;
      food = randFood();
      scoreVal.textContent = '0';
      lenVal.textContent = snake.length;
    }

    function tick() {
      if (nextDirs.length) {
        var nd = nextDirs.shift();
        if (nd.x !== -dir.x || nd.y !== -dir.y) dir = nd;
      }
      var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
          snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreVal.textContent = score;
        lenVal.textContent = snake.length;
        SFX.eat();
        food = randFood();
        if (speed > 75) { speed -= 3; clearInterval(timerId); timerId = setInterval(tick, speed); }
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, cv.width, cv.height);

      ctx.strokeStyle = 'rgba(57, 255, 20, 0.07)';
      ctx.lineWidth = 1;
      for (var i = 0; i <= GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, cv.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(cv.width, i * CELL); ctx.stroke();
      }

      var fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = '#ffe600';
      ctx.shadowColor = '#ffe600';
      ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(fx, fy, CELL * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;

      for (var j = snake.length - 1; j >= 0; j--) {
        var seg = snake[j];
        var t = j / Math.max(snake.length - 1, 1);
        ctx.fillStyle = j === 0 ? '#b6ffb0' : 'rgba(57, 255, 20, ' + (0.9 - t * 0.55) + ')';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = j === 0 ? 16 : 6;
        roundRect(seg.x * CELL + 1.5, seg.y * CELL + 1.5, CELL - 3, CELL - 3, 5);
      }
      ctx.shadowBlur = 0;
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }

    function gameOver() {
      running = false;
      clearInterval(timerId);
      SFX.over();
      var best = loadBest();
      if (score > best) {
        localStorage.setItem('gm_best_snake', String(score));
        overMsg.textContent = 'NEW RECORD! 最高スコア更新';
      } else {
        overMsg.textContent = '最高スコア ' + best + ' 点';
      }
      overStats.textContent = 'SCORE ' + score + ' / LENGTH ' + snake.length;
      showBest();
      setTimeout(function () { ovOver.classList.remove('hidden'); }, 450);
    }

    function start() {
      reset();
      draw();
      running = true;
      clearInterval(timerId);
      timerId = setInterval(tick, speed);
    }

    function pushDir(name) {
      var map = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
      if (!running || !map[name]) return;
      if (nextDirs.length < 3) nextDirs.push(map[name]);
    }

    var KEY = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
    document.addEventListener('keydown', function (e) {
      if (KEY[e.key]) { e.preventDefault(); pushDir(KEY[e.key]); }
    });
    document.querySelectorAll('.dbtn').forEach(function (b) {
      b.addEventListener('click', function () { pushDir(b.getAttribute('data-dir')); });
    });

    document.getElementById('btnStart').addEventListener('click', function () { SFX.click(); ovStart.classList.add('hidden'); start(); });
    document.getElementById('btnRetry').addEventListener('click', function () { SFX.click(); ovOver.classList.add('hidden'); start(); });

    showBest();
    reset();
    draw();
  })();
  </script>
</body>
</html>
