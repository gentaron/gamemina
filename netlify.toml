# ============================================================
# GameMina - Netlify configuration
# 静的サイトのため build コマンド不要。
# publish はリポジトリルートを指定。
# ============================================================

[build]
  publish = "."
  command = "echo 'Static site - no build required'"

[build.environment]
  NODE_VERSION = "20"

# ---------- セキュリティヘッダー ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ---------- キャッシュ ----------
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------- 便利なリダイレクト ----------
# 旧URL想定や打ち間違いを吸収
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/games"
  to = "/"
  status = 301
