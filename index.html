<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MINA CHRONICLE 〜光と音を永遠に〜 | GameMina RPG</title>
<meta name="description" content="E16星系を舞台にしたファイナルファンタジー風の本格長編RPG。AURALIS二代目・ミナ・エウレカ・アーネストの物語。PWA対応・オフラインで遊べる。">
<meta name="theme-color" content="#0a0f33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MINA RPG">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/game.css">
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- モバイル用仮想パッド -->
    <div id="pad" aria-hidden="true">
      <div id="dpad">
        <button class="pad-btn" data-pad="up"    style="grid-area:u">▲</button>
        <button class="pad-btn" data-pad="left"  style="grid-area:l">◀</button>
        <button class="pad-btn" data-pad="right" style="grid-area:r">▶</button>
        <button class="pad-btn" data-pad="down"  style="grid-area:d">▼</button>
      </div>
      <div id="actionBtns">
        <button class="act-btn ok"  data-pad="ok">A</button>
        <button class="act-btn cancel" data-pad="cancel">B</button>
        <button class="act-btn menu" data-pad="menu">☰</button>
      </div>
    </div>
  </div>

  <div id="rotateHint"><div>📱<br>端末を横にして遊んでね<br><small>MINA CHRONICLE</small></div></div>

  <div id="topbar">
    <span class="brand">MINA CHRONICLE</span>
    <button id="installBtn" onclick="doInstall()" style="display:none">📥 インストール</button>
  </div>
</div>

<script src="./js/data_core.js"></script>
<script src="./js/data_enemies.js"></script>
<script src="./js/data_maps.js"></script>
<script src="./js/data_story_a.js"></script>
<script src="./js/data_story_b.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/engine.js"></script>
<script src="./js/field.js"></script>
<script src="./js/menu.js"></script>
<script src="./js/story.js"></script>
<script src="./js/battle.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
