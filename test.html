<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA CONSOLE | GAMEMINA CHRONICLE</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0e1a">
<link rel="icon" href="./icons/favicon.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- ゲーム本体（UI 結合テストの対象として完全な DOM を構成） -->
  <div id="screen">
    <canvas id="game" width="480" height="304"></canvas>
    <div id="ui" aria-live="polite">
      <div id="hud" class="hidden">
        <div id="hud-chapter" class="hud-chip"></div>
        <div id="hud-right"><span id="hud-token" class="hud-chip"></span><button id="btn-fs" class="hud-btn" aria-label="フルスクリーン" title="フルスクリーン切替 (F)">⛶</button><button id="btn-menu" class="hud-btn" aria-label="メニュー" title="メニューを開く (C)">☰<span class="lbl">MENU</span></button></div>
      </div>
      <div id="dialogue" class="hidden">
        <div id="dlg-portrait" class="hidden"><img id="dlg-img" alt=""></div>
        <div id="dlg-body">
          <div id="dlg-name" class="hidden"></div>
          <div id="dlg-text"></div>
        </div>
        <div id="dlg-next" class="hidden">▼</div>
      </div>
      <div id="choice" class="hidden"></div>
      <div id="battle-ui" class="hidden">
        <div id="bat-log" class="win"></div>
        <div id="bat-party"></div>
        <div id="bat-cmd" class="win hidden"></div>
        <div id="bat-abil" class="win hidden"></div>
        <div id="bat-item" class="win hidden"></div>
        <div id="bat-target" class="win hidden"></div>
      </div>
      <div id="menu" class="hidden"></div>
      <div id="shop" class="hidden"></div>
      <div id="system-ui" class="hidden"></div>
      <div id="boss-intro" class="hidden">
        <div id="boss-intro-band"></div>
        <img id="boss-intro-img" alt="">
        <div id="boss-intro-caption">
          <div id="boss-intro-name"></div>
          <div id="boss-intro-sub"></div>
        </div>
      </div>
      <div id="chapter-card" class="hidden"></div>
      <div id="title" class="hidden"></div>
      <div id="toasts"></div>
    </div>
    <div id="touch" class="hidden">
      <div id="dpad">
        <button data-dir="up" class="tb tb-u" aria-label="上">▲</button>
        <button data-dir="left" class="tb tb-l" aria-label="左">◀</button>
        <button data-dir="right" class="tb tb-r" aria-label="右">▶</button>
        <button data-dir="down" class="tb tb-d" aria-label="下">▼</button>
      </div>
      <div id="actbtns">
        <button id="tb-a" class="tb-round" aria-label="決定">A</button>
        <button id="tb-b" class="tb-round tb-b" aria-label="キャンセル">B</button>
        <button id="tb-m" class="tb-round tb-m" aria-label="メニュー">M</button>
      </div>
    </div>
  </div>
  <div id="offline-banner" class="hidden">⚠ オフライン ─ キャッシュから動作中</div>
</div>

<!-- ゲームエンジン一式（index.html と同一順序） -->
<script src="js/audio.js"></script>
<script src="js/data/enemyart.js"></script>
<script src="js/data/portraits.js"></script>
<script src="js/sprites.js"></script>
<script src="js/data/abilities.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/characters.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/maps.js"></script>
<script src="js/data/story.js"></script>
<script src="js/engine/mapfix.js"></script>
<script src="js/engine/core.js"></script>
<script src="js/engine/ui.js"></script>
<script src="js/engine/save.js"></script>
<script src="js/engine/scenes.js"></script>
<script src="js/engine/field.js"></script>
<script src="js/engine/battle.js"></script>
<script src="js/engine/menu.js"></script>
<!-- QA ハーネス + UI 結合テスト + コンソール -->
<script src="js/tests/harness.js"></script>
<script src="js/tests/ui.tests.js"></script>
<script src="js/tests/console.js"></script>
<!-- ゲームブート（タイトル画面構築まで行い、UI テストの対象にする） -->
<script src="js/main.js"></script>
<script>
  window.addEventListener('load', () => {
    GM.normalizeMaps();
    GM.QA.openConsole(true);
  });
</script>
</body>
</html>
